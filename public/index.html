<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Companion</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Pick the colour theme before anything is drawn, so the page never flashes the wrong one.
    // app.js keeps it up to date (theme button, device switching between light and dark).
    (function () {
      var t;
      try { t = JSON.parse(localStorage.getItem("jpg.theme")); } catch (e) { /* ignore */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="#courses" title="All courses">
      <span class="brand-mark" id="brandMark" aria-hidden="true">S</span>
      <span class="brand-text">Study Companion<small id="brandSub">All courses</small></span>
    </a>
    <nav class="tabs" id="tabs">
      <div class="tab-group" data-course-only="japanese">
        <button data-tab="home"><span class="tab-mark" lang="ja" aria-hidden="true">家</span>Home</button>
        <button data-tab="lessons"><span class="tab-mark" lang="ja" aria-hidden="true">課</span>Lessons</button>
      </div>
      <div class="tab-group" data-course-only="japanese">
        <span class="tab-cap">Grammar</span>
        <button data-tab="structure"><span class="tab-mark" lang="ja" aria-hidden="true">文</span>Sentences</button>
        <button data-tab="particles"><span class="tab-mark" lang="ja" aria-hidden="true">は</span>Particles</button>
        <button data-tab="verbs"><span class="tab-mark" lang="ja" aria-hidden="true">動</span>Verbs</button>
        <button data-tab="adjectives"><span class="tab-mark" lang="ja" aria-hidden="true">形</span>Adjectives</button>
        <button data-tab="patterns"><span class="tab-mark" lang="ja" aria-hidden="true">型</span>Patterns</button>
      </div>
      <div class="tab-group" data-course-only="japanese">
        <span class="tab-cap">Train</span>
        <button data-tab="practice"><span class="tab-mark" lang="ja" aria-hidden="true">練</span>Practice</button>
        <button data-tab="listen"><span class="tab-mark" lang="ja" aria-hidden="true">聴</span>Listen</button>
        <button data-tab="mistakes"><span class="tab-mark" lang="ja" aria-hidden="true">直</span>Mistakes</button>
      </div>
      <!-- LEN (len.js): every label in German and English, the language switch picks one. -->
      <div class="tab-group" data-course-only="len">
        <button data-tab="len-home"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 7.6 8 2.5l6 5.1"/><path d="M3.8 6.3V13.5h3V10h2.4v3.5h3V6.3"/></svg></span><span class="l-de" lang="de">Start</span><span class="l-en">Home</span></button>
        <button data-tab="len-formulas"><span class="tab-mark" aria-hidden="true">Σ</span><span class="l-de" lang="de">Formeln &amp; Begriffe</span><span class="l-en">Formulas &amp; terms</span></button>
      </div>
      <div class="tab-group" data-course-only="len">
        <span class="tab-cap"><span class="l-de" lang="de">Kapitel</span><span class="l-en">Chapters</span></span>
        <button data-tab="len-basics"><span class="tab-mark" aria-hidden="true">1</span><span class="l-de" lang="de">Grundlagen</span><span class="l-en">Basics</span></button>
      </div>
      <div class="tab-group" data-course-only="len">
        <span class="tab-cap"><span class="l-de" lang="de">Klausur</span><span class="l-en">Exam</span></span>
        <button data-tab="len-exams"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M9.5 1.8V5h3M6 8h4.5M6 10.8h4.5"/></svg></span><span class="l-de" lang="de">Altklausuren</span><span class="l-en">Old exams</span></button>
        <button data-tab="len-practice"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M10.8 2.2l3 3-8.3 8.3-3.6.6.6-3.6z"/><path d="M9.2 3.8l3 3"/></svg></span><span class="l-de" lang="de">Übungsaufgaben</span><span class="l-en">Practice</span></button>
        <button data-tab="len-mock"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="5.5"/><path d="M8 6v3.2l2 1.4M6.5 1.8h3"/></svg></span><span class="l-de" lang="de">Probeklausur</span><span class="l-en">Mock exam</span></button>
      </div>
      <!-- ProPa (propa.js): the Lean part and the Reussner part, each a group of chapters. -->
      <div class="tab-group" data-course-only="propa">
        <button data-tab="propa-home"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 7.6 8 2.5l6 5.1"/><path d="M3.8 6.3V13.5h3V10h2.4v3.5h3V6.3"/></svg></span>Home</button>
        <button data-tab="propa-cheat"><span class="tab-mark" aria-hidden="true">λ</span>Cheat sheet</button>
      </div>
      <div class="tab-group" data-course-only="propa">
        <span class="tab-cap">Lean</span>
        <button data-tab="propa-l1"><span class="tab-mark" aria-hidden="true">1</span>Basics</button>
        <button data-tab="propa-l2"><span class="tab-mark" aria-hidden="true">2</span>Functions as values</button>
        <button data-tab="propa-l3"><span class="tab-mark" aria-hidden="true">3</span>Scaling up</button>
        <button data-tab="propa-l4"><span class="tab-mark" aria-hidden="true">4</span>Effects</button>
      </div>
      <div class="tab-group" data-course-only="propa">
        <span class="tab-cap">Reussner</span>
        <button data-tab="propa-l5"><span class="tab-mark" aria-hidden="true">5</span>Parallel basics</button>
        <button data-tab="propa-l6"><span class="tab-mark" aria-hidden="true">6</span>C and MPI</button>
        <button data-tab="propa-l7"><span class="tab-mark" aria-hidden="true">7</span>Java threads</button>
        <button data-tab="propa-l8"><span class="tab-mark" aria-hidden="true">8</span>Design by Contract</button>
      </div>
      <div class="tab-group" data-course-only="propa">
        <span class="tab-cap">Train</span>
        <button data-tab="propa-exams"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M9.5 1.8V5h3M6 8h4.5M6 10.8h4.5"/></svg></span>Old exams</button>
        <button data-tab="propa-practice"><span class="tab-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M10.8 2.2l3 3-8.3 8.3-3.6.6.6-3.6z"/><path d="M9.2 3.8l3 3"/></svg></span>Practice</button>
      </div>
    </nav>
    <div class="account" id="account"></div>
    <label class="switch" data-course-only="japanese">
      <input type="checkbox" id="furiToggle" checked>
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span>Furigana</span>
    </label>
    <div class="switch lang-switch" data-course-only="len">
      <span class="seg lang-seg" id="lenLang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" lang="de">DE</button><button type="button" data-lang="en">EN</button>
      </span>
      <span><span class="l-de" lang="de">Sprache</span><span class="l-en">Language</span></span>
    </div>
    <button class="account-btn theme-btn" id="themeBtn" type="button"></button>
  </header>

  <main>
    <section id="courses" class="panel"></section>
    <section id="home" class="panel"></section>
    <section id="lessons" class="panel"></section>
    <section id="structure" class="panel"></section>
    <section id="particles" class="panel"></section>
    <section id="verbs" class="panel"></section>
    <section id="adjectives" class="panel"></section>
    <section id="patterns" class="panel"></section>
    <section id="practice" class="panel"></section>
    <section id="listen" class="panel"></section>
    <section id="mistakes" class="panel"></section>
    <section id="len-home" class="panel"></section>
    <section id="len-basics" class="panel"></section>
    <section id="len-formulas" class="panel"></section>
    <section id="len-exams" class="panel"></section>
    <section id="len-practice" class="panel"></section>
    <section id="len-mock" class="panel"></section>
    <section id="propa-home" class="panel"></section>
    <section id="propa-l1" class="panel"></section>
    <section id="propa-l2" class="panel"></section>
    <section id="propa-l3" class="panel"></section>
    <section id="propa-l4" class="panel"></section>
    <section id="propa-l5" class="panel"></section>
    <section id="propa-l6" class="panel"></section>
    <section id="propa-l7" class="panel"></section>
    <section id="propa-l8" class="panel"></section>
    <section id="propa-cheat" class="panel"></section>
    <section id="propa-practice" class="panel"></section>
    <section id="propa-exams" class="panel"></section>
  </main>

  <!-- Each course has its own line here (`footer` in courses.js). -->
  <footer class="footer" id="footer"></footer>

  <!-- The account's lesson progress, from server.js (missing when the page is opened as a file). -->
  <script src="progress.js"></script>
  <script src="js/data.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/verbs.js"></script>
